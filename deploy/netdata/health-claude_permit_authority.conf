# An uncertain ticket is a client that began provider work and never acknowledged completion.
# It consumes lane capacity and never self-releases, so a lane silently loses concurrency until
# an operator reconciles it. Two uncertain tickets on a max-2 lane wedge it completely.
 template: claude_lane_uncertain_tickets
       on: prometheus.claude_permit_authority.claude_lane_uncertain_tickets
    class: Errors
     type: Computing
component: claude-permit-authority
   lookup: max -2m unaligned of claude_lane_uncertain_tickets
    every: 30s
     warn: $this > 0
     crit: $this >= 2
    units: tickets
     info: Uncertain permit tickets are holding lane capacity; reconcile them to free the lane.

# The prober publishes allowance every 90s. If observations stop ageing forward, the menu and
# every session footer silently drift back to stale numbers.
 template: claude_lane_allowance_stale
       on: prometheus.claude_permit_authority.claude_lane_allowance_age_seconds
    class: Latency
     type: Computing
component: claude-permit-authority
   lookup: max -2m unaligned of claude_lane_allowance_age_seconds
    every: 60s
     warn: $this > 600
     crit: $this > 1800
    units: seconds
     info: Newest accepted allowance observation is ageing; the allowance prober may have stopped.

# A queue that never drains means capacity is gone, not merely busy.
 template: claude_lane_queue_stalled
       on: prometheus.claude_permit_authority.claude_lane_oldest_wait_seconds
    class: Latency
     type: Computing
component: claude-permit-authority
   lookup: min -5m unaligned of claude_lane_oldest_wait_seconds
    every: 60s
     warn: $this > 300
     crit: $this > 900
    units: seconds
     info: Oldest queued permit has waited this long; the lane may be wedged.

# Throttling halves a lane's slots. While degraded, one orphaned lease consumes the entire lane,
# which is how a single stuck ticket starved every queued session.
 template: claude_lane_concurrency_degraded
       on: prometheus.claude_permit_authority.claude_lane_concurrency_degraded
    class: Workload
     type: Computing
component: claude-permit-authority
   lookup: max -5m unaligned of claude_lane_concurrency_degraded
    every: 60s
     warn: $this > 0
     crit: $this > 1
    units: slots
     info: Lane is running below maximum concurrency; an orphaned lease can now wedge it entirely.

# A lock left by a killed session makes every acquire on that machine fail while lanes look healthy.
 template: claude_client_ledger_lock_age
       on: prometheus.claude_permit_authority.claude_client_ledger_lock_age_seconds
    class: Errors
     type: Computing
component: claude-permit-authority
   lookup: max -2m unaligned of claude_client_ledger_lock_age_seconds
    every: 30s
     warn: $this > 30
     crit: $this > 120
    units: seconds
     info: Client ledger lock is orphaned; permit acquisition on this machine is failing.

# A client record that never resolves is a session stuck waiting, invisible in lane metrics.
 template: claude_client_stuck_record
       on: prometheus.claude_permit_authority.claude_client_ledger_oldest_age_seconds
    class: Latency
     type: Computing
component: claude-permit-authority
   lookup: min -5m unaligned of claude_client_ledger_oldest_age_seconds
    every: 60s
     warn: $this > 300
     crit: $this > 900
    units: seconds
     info: A Pi session has been waiting on a permit for this long.
