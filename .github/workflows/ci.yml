name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # The standalone prober loads Pi from the Node installation; CI must exercise the real resolver.
      - run: npm install --global --no-audit --no-fund @earendil-works/pi-coding-agent@0.87.1
      - run: npm test
